name: Pombo VPS checks
on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m compileall -q pombo pombo.py
      - name: Broadcast error classification
        run: python -m unittest discover -s tests -p "test_telegram_errors.py" -v
